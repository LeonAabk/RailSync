# Bygger RailSync og publiserer til GitHub Pages (aabakstudio.com/RailSync/).
# - Alle grener: bygger og sjekker at alt er på plass (ingen publisering).
# - main: bygger og publiserer.
name: Bygg og publiser

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer utviklingsverktøy
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      - name: Enhetstester
        run: npm test

      - name: Bygg app.js fra src/app/
        run: node scripts/build-app.cjs

      - name: Kopier nettsidens filer
        run: |
          mkdir -p _site
          cp -r index.html app.js sw.js manifest.webmanifest assets _site/

      - name: Bygg CSS med Tailwind
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i styles/tailwind.css -o _site/assets/railsync.css --minify

      - name: Bygg ikonfil (bare Lucide-ikonene appen bruker)
        run: |
          (cd "$RUNNER_TEMP" && npm pack lucide@1.71.0 --silent && tar -xzf lucide-1.71.0.tgz)
          node scripts/build-icons.cjs "$RUNNER_TEMP/package/dist/umd/lucide.min.js" _site/assets/icons.js

      - name: Sett versjonsnummer (tvinger nettlesere til å hente nye filer)
        run: |
          VER="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          sed -i -E "s/\?v=dev\"/?v=${VER}\"/g" _site/index.html
          sed -i -E "s/const APP_VERSION = \"dev\"/const APP_VERSION = \"${VER}\"/" _site/app.js
          sed -i -E "s/^const VERSION = \"dev\";/const VERSION = \"${VER}\";/" _site/sw.js
          grep -q "app.js?v=${VER}" _site/index.html
          grep -q "railsync.css?v=${VER}" _site/index.html
          grep -q "icons.js?v=${VER}" _site/index.html
          grep -q "dispatch.js?v=${VER}" _site/index.html
          grep -q "const APP_VERSION = \"${VER}\"" _site/app.js
          grep -q "^const VERSION = \"${VER}\";" _site/sw.js
          echo "Versjon: ${VER}"

      - name: Minifiser app.js (etter at versjonsnummeret er satt inn)
        run: node scripts/minify.mjs _site/app.js

      - name: Sjekk bygget
        run: |
          test -s _site/assets/railsync.css
          test -s _site/app.js.map
          for f in fonts/plus-jakarta-sans-latin.woff2 fonts/plus-jakarta-sans-latin-ext.woff2 fonts/OFL.txt img/innlogging-1600.webp img/forside.webp img/steder/tog.webp; do test -s "_site/assets/$f"; done
          grep -q 'plus-jakarta-sans-latin.woff2' _site/assets/railsync.css || { echo "Mangler @font-face i CSS-en"; exit 1; }
          ! grep -q 'fonts.googleapis.com' _site/index.html
          ! grep -q 'images.unsplash.com' _site/index.html _site/app.js
          for cls in '.bg-fjord-800' '.bg-sand-100' '.max-lg\:hidden' '.text-fjord-200' '.bg-white\/10' '.peer:checked'; do
            grep -qF "$cls" _site/assets/railsync.css || { echo "Mangler $cls i CSS-en"; exit 1; }
          done
          grep -q 'assets/railsync.css' _site/index.html
          test -s _site/sw.js && node -e "JSON.parse(require('fs').readFileSync('_site/manifest.webmanifest','utf8'))"
          for f in icons.js icon.svg favicon-32.png apple-touch-icon.png icon-192.png icon-512.png og-image.png; do test -s "_site/assets/$f"; done
          ! grep -q 'cdn.tailwindcss.com' _site/index.html
          ! grep -q 'unpkg.com/lucide' _site/index.html
          # Ingen inline JavaScript (stoppes av Content-Security-Policy)
          ! grep -qE '[^-]on(click|submit|change|input)="' _site/index.html _site/app.js
          test -s _site/assets/dispatch.js
          ls -la _site _site/assets

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Tester sikkerhetsreglene (firestore.rules) mot Firestore-emulatoren.
  # Publisering stopper hvis en test feiler.
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer testavhengigheter
        run: npm ci --no-audit --no-fund

      - name: Test sikkerhetsreglene
        run: npm run test:rules

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, test-rules]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
